name: Update National Championship Results

on:
  schedule:
    # Run every 15 minutes during tournament hours (4 AM - 4 PM UTC = 9:30 AM - 9:30 PM IST)
    - cron: '*/15 4-16 * 6-7 *'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and update results
        run: python update_national.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "🏆 Auto-update National Championship results"
          git push
